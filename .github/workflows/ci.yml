name: MOLTBEER CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOLTBEER_STORAGE_MODE: ephemeral
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Production dependency vulnerability audit (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high
      - name: Public bar read-only smoke (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 3
        env:
          MOLTBEER_BASE_URL: https://moltbeer-free-bar-api-production.up.railway.app
          MOLTBEER_EXPECTED_PERSISTENCE: durable
        run: node scripts/smoke-readonly.mjs
      - name: Comprehensive read-only public API/MCP audit (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 4
        env:
          MOLTBEER_BASE_URL: https://moltbeer-free-bar-api-production.up.railway.app
          MOLTBEER_EXPECTED_PERSISTENCE: durable
        run: node scripts/audit-remote-readonly.mjs
