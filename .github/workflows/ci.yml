name: MOLTBEER CI
on:
  # Run explicitly after Railway has deployed the matching main commit.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOLTBEER_STORAGE_MODE: ephemeral
      MOLTBEER_CI_POSTGRES_URL: postgresql://moltbeer_ci:ci_only_password@127.0.0.1:5432/moltbeer_ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moltbeer_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: moltbeer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moltbeer_ci -d moltbeer_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject PR branches missing current main history
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main "$PR_HEAD_SHA"; then
            echo 'PR branch is based on outdated main; rebase before merge.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Production dependency vulnerability audit (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        timeout-minutes: 3
        run: npm audit --omit=dev --audit-level=high
      - name: Production read-only smoke (post-deploy acceptance)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        env:
          MOLTBEER_BASE_URL: https://moltbeer-free-bar-api-production.up.railway.app
          MOLTBEER_EXPECTED_PERSISTENCE: durable
        run: node scripts/smoke-readonly.mjs
      - name: Production REST/MCP audit (post-deploy acceptance)
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        env:
          MOLTBEER_BASE_URL: https://moltbeer-free-bar-api-production.up.railway.app
          MOLTBEER_EXPECTED_PERSISTENCE: durable
        run: node scripts/audit-remote-readonly.mjs
